name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ncc
          POSTGRES_PASSWORD: ncc
          POSTGRES_DB: ncc
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ncc" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ncc:ncc@localhost:5432/ncc
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Live exchange-rate API check (warning only)
        continue-on-error: true
        run: pnpm --filter @ncc/api exec vitest run test/fx-live.test.ts
        env:
          FX_LIVE: '1'
      - run: pnpm build
      - name: Apply migrations to a fresh database
        run: node apps/api/dist/migrate-cli.js
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --build-arg APP_VERSION=${{ github.sha }} -t nochickencall:ci .
