name: Deploy

# Deploys main to Fly.io after CI passes. Does nothing until these repo secrets exist:
#   FLY_API_TOKEN  – Fly.io org token (fly.io dashboard → Tokens)
#   DATABASE_URL   – Neon connection string (…?sslmode=require)
# Optional repo variable FLY_APP: app name / subdomain (default: nochickencall-clem)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP: ${{ vars.FLY_APP || 'nochickencall-clem' }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$FLY_API_TOKEN" ] || [ -z "$DATABASE_URL" ]; then
            echo "::notice::Skipping deploy: add FLY_API_TOKEN and DATABASE_URL repo secrets to enable it."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.check.outputs.ready == 'true'

      - name: Create the Fly app on first deploy
        if: steps.check.outputs.ready == 'true'
        run: |
          if flyctl status --app "$APP" >/dev/null 2>&1; then
            echo "App $APP exists"
          else
            flyctl apps create "$APP" --org personal
          fi

      - name: Set app secrets
        if: steps.check.outputs.ready == 'true'
        run: |
          flyctl secrets set --app "$APP" --stage \
            DATABASE_URL="$DATABASE_URL" \
            PUBLIC_ORIGIN="https://$APP.fly.dev"

      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        run: |
          flyctl deploy --app "$APP" --remote-only --primary-region sin \
            --build-arg APP_VERSION="$(git rev-parse --short HEAD)"

      - name: Smoke test
        if: steps.check.outputs.ready == 'true'
        run: |
          for i in $(seq 1 20); do
            body=$(curl -fsS "https://$APP.fly.dev/api/v1/health" || true)
            echo "$body"
            if echo "$body" | grep -q '"db":"ok"'; then
              echo "::notice::Live at https://$APP.fly.dev"
              exit 0
            fi
            sleep 6
          done
          echo "::error::Health check failed"; exit 1
