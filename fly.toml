# Fly.io config. Set the app name with `fly launch --no-deploy` (it rewrites this line).
app = "nochickencall"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/v1/ping"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
