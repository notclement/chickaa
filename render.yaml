# Render Blueprint: one free Docker web service (API + PWA) in Singapore.
# Database: Neon (Render's free Postgres expires), so DATABASE_URL is entered once on setup.
services:
  - type: web
    name: nochickencall
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    # /ping never touches the database, so frequent health checks don't keep Neon awake
    # (Neon free = 100 compute-hours/month; an always-awake database would exceed it).
    healthCheckPath: /api/v1/ping
    # Only deploy commits whose GitHub CI checks passed.
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        sync: false # paste the Neon connection string when prompted
      - key: NODE_ENV
        value: production
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - key: ADMIN_SETUP_CODE
        sync: false # one-time code to create the "admin" account; set privately in the dashboard
      # PUBLIC_ORIGIN defaults to Render's RENDER_EXTERNAL_URL (https://<name>.onrender.com).
      # Set it here only if you add a custom domain.
